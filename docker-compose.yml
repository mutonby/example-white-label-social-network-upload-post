version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: sveditor_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sveditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sveditor_password}
      POSTGRES_DB: ${POSTGRES_DB:-sveditor}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sveditor_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sveditor_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://sveditor:sveditor_password@postgres:5432/sveditor}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-change_me_super_secret}
      UPLOAD_POST_API_BASE: ${UPLOAD_POST_API_BASE:-https://api.upload-post.com}
      UPLOAD_POST_API_KEY: "upload_post_api_key"
      UPLOAD_POST_WEBHOOK_SECRET: ${UPLOAD_POST_WEBHOOK_SECRET:-replace_with_webhook_secret}
    ports:
      - "4000:4000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: sveditor_web
    depends_on:
      api:
        condition: service_started
    environment:
      VITE_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
